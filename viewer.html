<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Imortais da Bola — Visualizador</title>
<style>
  :root {
    --bg: #0f172a;
    --panel: #1e293b;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --home: #3b82f6;
    --away: #f97316;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  header {
    padding: 16px 20px;
    background: var(--panel);
    border-bottom: 1px solid #334155;
  }
  h1 {
    margin: 0 0 12px;
    font-size: 1.1rem;
    color: var(--muted);
    font-weight: 600;
  }

  #scoreboard {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
    font-size: 1.6rem;
    font-weight: 700;
    margin-bottom: 12px;
  }
  #scoreboard .team-home { color: var(--home); text-align: right; flex: 1; }
  #scoreboard .team-away { color: var(--away); text-align: left; flex: 1; }
  #scoreboard .score { font-variant-numeric: tabular-nums; }
  #scoreboard .score.pulse { animation: pulse 0.6s ease-out; }
  #clock {
    font-variant-numeric: tabular-nums;
    background: #0f172a;
    padding: 2px 10px;
    border-radius: 6px;
    font-size: 1.1rem;
  }
  @keyframes pulse {
    0% { transform: scale(1.5); }
    100% { transform: scale(1); }
  }

  #teamControls, .action-row {
    display: flex;
    gap: 12px;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    font-size: 0.9rem;
  }
  #teamControls { padding-bottom: 10px; border-bottom: 1px dashed #334155; margin-bottom: 10px; }
  #teamControls label, .action-row label { display: flex; align-items: center; gap: 6px; color: var(--muted); }
  #teamControls select, #teamControls input,
  .action-row input, .action-row select {
    background: #0f172a;
    color: var(--text);
    border: 1px solid #334155;
    border-radius: 4px;
    padding: 4px 8px;
    width: 110px;
  }
  #teamControls .club-group {
    display: flex;
    gap: 8px;
    align-items: center;
    padding: 4px 10px;
    border-radius: 6px;
    background: rgba(255, 255, 255, 0.03);
  }
  #teamControls .club-group.side-home { border-left: 3px solid var(--home); }
  #teamControls .club-group.side-away { border-left: 3px solid var(--away); }
  #teamControls #homeClub, #teamControls #awayClub { width: 160px; }
  #teamControls select { width: 100px; }

  button.action-btn {
    background: #16a34a;
    color: white;
    border: none;
    border-radius: 6px;
    padding: 6px 16px;
    font-weight: 600;
    cursor: pointer;
  }
  button.action-btn:disabled { background: #334155; cursor: default; }
  .status { color: var(--muted); font-size: 0.85rem; margin-left: 8px; }

  #tabBar {
    display: flex;
    gap: 4px;
    justify-content: center;
    margin-top: 12px;
  }
  #tabBar .tab-btn {
    background: transparent;
    color: var(--muted);
    border: 1px solid #334155;
    border-bottom: none;
    border-radius: 6px 6px 0 0;
    padding: 6px 18px;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
  }
  #tabBar .tab-btn.active { background: var(--bg); color: var(--text); }

  .action-row { padding: 10px 0; }
  .tab-panel { display: none; flex: 1; min-height: 0; flex-direction: column; }
  .tab-panel.active { display: flex; }

  #matchArea {
    flex: 1;
    display: flex;
    overflow: hidden;
  }

  .lineup {
    width: 190px;
    flex-shrink: 0;
    overflow-y: auto;
    padding: 10px 0;
    border-color: #334155;
  }
  .lineup.side-home { border-right: 1px solid #334155; }
  .lineup.side-away { border-left: 1px solid #334155; }
  .lineup .player {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 5px 12px;
    font-size: 0.82rem;
    border-left: 3px solid transparent;
  }
  .lineup.side-home .player { border-left-color: var(--home); }
  .lineup.side-away .player { border-right: 3px solid var(--away); border-left: none; }
  .lineup .player.sent-off { opacity: 0.45; }
  .lineup .pos {
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    font-size: 0.72rem;
    min-width: 28px;
  }
  .lineup .name {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .lineup .era {
    color: var(--muted);
    font-size: 0.68rem;
    font-variant-numeric: tabular-nums;
    flex-shrink: 0;
  }
  .lineup .badges {
    display: flex;
    gap: 2px;
    flex-shrink: 0;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 12px;
    height: 12px;
    font-size: 9px;
    line-height: 1;
    border-radius: 2px;
  }
  .badge-yellow { background: #eab308; }
  .badge-red { background: #dc2626; }
  .badge-injury {
    background: #dc2626;
    border-radius: 50%;
    color: white;
    font-weight: 700;
  }
  .badge-goal { width: auto; font-size: 11px; }

  #log {
    flex: 1;
    overflow-y: auto;
    padding: 10px 0;
    max-width: 720px;
    margin: 0 auto;
    width: 100%;
  }
  #log .hint { text-align: center; color: var(--muted); margin-top: 40px; }
  .event {
    display: flex;
    gap: 10px;
    align-items: baseline;
    padding: 6px 16px;
    border-left: 4px solid transparent;
  }
  .event[data-side="home"] { border-left-color: var(--home); }
  .event[data-side="away"] { border-left-color: var(--away); }
  .event .minute {
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    min-width: 34px;
  }
  .event .text { flex: 1; }

  .event.ev-goal { font-weight: 700; }
  .event.ev-goal[data-side="home"] { background: rgba(59, 130, 246, 0.18); }
  .event.ev-goal[data-side="away"] { background: rgba(249, 115, 22, 0.18); }
  .event.ev-yellow .text { color: #eab308; }
  .event.ev-red { background: rgba(220, 38, 38, 0.12); }
  .event.ev-red .text { color: #f87171; font-weight: 600; }
  .event.ev-comedy { background: rgba(168, 85, 247, 0.15); font-style: italic; }
  .event.ev-scandalous { background: rgba(249, 115, 22, 0.18); font-style: italic; font-weight: 600; }
  .event.ev-disallowed { background: rgba(220, 38, 38, 0.12); font-weight: 700; }
  .event.ev-disallowed .text { color: #f87171; }
  .event.ev-injury { background: rgba(220, 38, 38, 0.1); }
  .event.ev-injury .text { color: #fca5a5; }
  .event.ev-injustice { background: rgba(220, 38, 38, 0.16); font-style: italic; font-weight: 700; }
  .event.ev-injustice .text { color: #f87171; }
  .event.ev-trash-talk { font-style: italic; }
  .event.ev-trash-talk .text { color: #facc15; }
  .event.ev-whiff { font-style: italic; }
  .event.ev-whiff .text { color: #94a3b8; }
  .event.ev-save .text { color: #60a5fa; }
  .event.ev-special { background: rgba(250, 204, 21, 0.16); font-weight: 700; }
  .event.ev-time-wasting .text { color: var(--muted); font-size: 0.9em; }
  .event.ev-divider {
    justify-content: center;
    border-left: none;
    color: var(--muted);
    font-weight: 700;
    margin: 8px 0;
  }
  .event.ev-divider .minute { display: none; }

  #calibrationPanel { overflow-y: auto; }
  #calReport { max-width: 900px; margin: 0 auto; padding: 8px 20px 40px; }
  #calReport .hint { text-align: center; color: var(--muted); margin-top: 40px; }
  .cal-section {
    background: var(--panel);
    border: 1px solid #334155;
    border-radius: 8px;
    padding: 14px 18px;
    margin-bottom: 14px;
  }
  .cal-section h2 {
    margin: 0 0 10px;
    font-size: 0.95rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  .cal-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 8px 20px;
  }
  .cal-stat { display: flex; justify-content: space-between; gap: 10px; padding: 3px 0; font-size: 0.88rem; }
  .cal-stat .label { color: var(--muted); }
  .cal-stat .value { font-variant-numeric: tabular-nums; font-weight: 600; }
  table.cal-table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
  table.cal-table th, table.cal-table td { text-align: left; padding: 4px 8px; border-bottom: 1px solid #334155; }
  table.cal-table th { color: var(--muted); font-weight: 600; }
  table.cal-table td.num, table.cal-table th.num { text-align: right; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
  <header>
    <h1>Imortais da Bola — visualizador de partida &amp; calibragem</h1>
    <div id="scoreboard">
      <span class="team-home" id="homeName">—</span>
      <span class="score"><span id="homeScore">0</span> x <span id="awayScore">0</span></span>
      <span class="team-away" id="awayName">—</span>
    </div>
    <div id="teamControls">
      <div class="club-group side-home">
        <label>Casa <select id="homeClub"></select></label>
        <label>Postura
          <select id="homePosture">
            <option value="attacking">ofensiva</option>
            <option value="balanced" selected>equilibrada</option>
            <option value="defensive">defensiva</option>
          </select>
        </label>
        <label>Catimba
          <select id="homeGamesmanship">
            <option value="auto" selected>auto</option>
            <option value="0">0</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
          </select>
        </label>
      </div>
      <div class="club-group side-away">
        <label>Visitante <select id="awayClub"></select></label>
        <label>Postura
          <select id="awayPosture">
            <option value="attacking">ofensiva</option>
            <option value="balanced" selected>equilibrada</option>
            <option value="defensive">defensiva</option>
          </select>
        </label>
        <label>Catimba
          <select id="awayGamesmanship">
            <option value="auto" selected>auto</option>
            <option value="0">0</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
          </select>
        </label>
      </div>
      <label>Formação
        <select id="formation">
          <option value="4-4-2" selected>4-4-2</option>
          <option value="4-3-3">4-3-3</option>
          <option value="4-2-4">4-2-4</option>
        </select>
      </label>
    </div>
    <div id="tabBar">
      <button class="tab-btn active" data-tab="match">Partida</button>
      <button class="tab-btn" data-tab="calibration">Calibragem</button>
    </div>
    <div class="action-row" id="matchActionRow">
      <span id="clock">0'</span>
      <label>Seed <input id="seedInput" type="number" placeholder="aleatória" /></label>
      <label>Velocidade
        <select id="speed">
          <option value="600">lenta</option>
          <option value="300" selected>normal</option>
          <option value="120">rápida</option>
        </select>
      </label>
      <button id="playBtn" class="action-btn">Nova partida</button>
      <span id="status" class="status"></span>
    </div>
    <div class="action-row" id="calActionRow" style="display: none;">
      <label>Seed base <input id="calSeedInput" type="number" placeholder="aleatória" /></label>
      <label>Partidas <input id="calCountInput" type="number" min="1" max="5000" value="500" /></label>
      <button id="calRunBtn" class="action-btn">Rodar calibragem</button>
      <span id="calStatus" class="status"></span>
    </div>
  </header>

  <div id="matchPanel" class="tab-panel active">
    <div id="matchArea">
      <aside id="homeLineup" class="lineup side-home"></aside>
      <main id="log"><p class="hint">Clique em "Nova partida" para simular um confronto.</p></main>
      <aside id="awayLineup" class="lineup side-away"></aside>
    </div>
  </div>

  <div id="calibrationPanel" class="tab-panel">
    <div id="calReport"><p class="hint">Escolha os times/configurações acima e clique em "Rodar calibragem".</p></div>
  </div>

  <script type="module">
    import {
      createRng,
      FORMATIONS,
      draftEleven,
      simulateMatch,
      EVENT_TYPES,
      GOAL_EVENT_TYPES,
      defaultGamesmanship,
    } from './src/engine/index.js';

    // Each club's data lives in its own folder under src/data/clubs/ (see
    // src/data/clubs/index.js for the Node-side equivalent of this same
    // loading/merging step, including why era files get combined into one
    // pool). The browser can't list that directory itself, so the list of
    // clubs/era files comes from scripts/serve-viewer.js's own
    // /api/clubs-manifest endpoint (see discover.js for the shared scan
    // logic) instead of being hardcoded here — a top-level await works
    // because this is a <script type="module">.
    const CLUBS = await fetch('/api/clubs-manifest').then((response) => response.json());
    const SAMPLE_CLUBS = await Promise.all(
      CLUBS.map(async ({ slug, files }) => {
        const parts = await Promise.all(
          files.map((file) => fetch(`./src/data/clubs/${slug}/${file}`).then((response) => response.json()))
        );
        const pool = parts.flatMap((part) => part.pool.map((player) => ({ ...player, era: part.era ?? null })));
        return { slug: parts[0].slug, name: parts[0].name, pool };
      })
    );

    const els = {
      homeName: document.getElementById('homeName'),
      awayName: document.getElementById('awayName'),
      homeScore: document.getElementById('homeScore'),
      awayScore: document.getElementById('awayScore'),
      clock: document.getElementById('clock'),
      log: document.getElementById('log'),
      homeClubSelect: document.getElementById('homeClub'),
      awayClubSelect: document.getElementById('awayClub'),
      homePostureSelect: document.getElementById('homePosture'),
      awayPostureSelect: document.getElementById('awayPosture'),
      homeGamesmanshipSelect: document.getElementById('homeGamesmanship'),
      awayGamesmanshipSelect: document.getElementById('awayGamesmanship'),
      formationSelect: document.getElementById('formation'),
      seedInput: document.getElementById('seedInput'),
      speedSelect: document.getElementById('speed'),
      playBtn: document.getElementById('playBtn'),
      status: document.getElementById('status'),
      homeLineup: document.getElementById('homeLineup'),
      awayLineup: document.getElementById('awayLineup'),
      matchActionRow: document.getElementById('matchActionRow'),
      calActionRow: document.getElementById('calActionRow'),
      calSeedInput: document.getElementById('calSeedInput'),
      calCountInput: document.getElementById('calCountInput'),
      calRunBtn: document.getElementById('calRunBtn'),
      calStatus: document.getElementById('calStatus'),
      calReport: document.getElementById('calReport'),
      matchPanel: document.getElementById('matchPanel'),
      calibrationPanel: document.getElementById('calibrationPanel'),
    };

    for (const select of [els.homeClubSelect, els.awayClubSelect]) {
      select.innerHTML = SAMPLE_CLUBS.map((club, i) => `<option value="${i}">${club.name}</option>`).join('');
    }
    els.awayClubSelect.value = SAMPLE_CLUBS.findIndex((club) => club.slug === 'uniao-da-porrada');

    // --- Tabs ---------------------------------------------------------------

    for (const btn of document.querySelectorAll('#tabBar .tab-btn')) {
      btn.addEventListener('click', () => {
        for (const b of document.querySelectorAll('#tabBar .tab-btn')) b.classList.toggle('active', b === btn);
        const tab = btn.dataset.tab;
        els.matchPanel.classList.toggle('active', tab === 'match');
        els.calibrationPanel.classList.toggle('active', tab === 'calibration');
        els.matchActionRow.style.display = tab === 'match' ? '' : 'none';
        els.calActionRow.style.display = tab === 'calibration' ? '' : 'none';
      });
    }

    // --- Shared team building (used by both the single-match tab and the
    // calibration tab, so "escolher os times e configurar os outros
    // elementos" applies to both the same way) ------------------------------

    // `gamesmanship` select value is either 'auto' (defaultGamesmanship,
    // based on the drafted lineup's cynicalFouler traits) or a fixed 0-3
    // override — same choice the actual game itself never exposes, but
    // useful here to isolate catimba's effect while calibrating.
    function buildTeam(side, rng) {
      const clubSelect = side === 'home' ? els.homeClubSelect : els.awayClubSelect;
      const postureSelect = side === 'home' ? els.homePostureSelect : els.awayPostureSelect;
      const gamesmanshipSelect = side === 'home' ? els.homeGamesmanshipSelect : els.awayGamesmanshipSelect;

      const club = SAMPLE_CLUBS[Number(clubSelect.value)];
      const formation = FORMATIONS[els.formationSelect.value];
      const lineup = draftEleven(club.pool, formation, rng);
      const gamesmanshipValue = gamesmanshipSelect.value;
      const gamesmanship = gamesmanshipValue === 'auto' ? defaultGamesmanship(lineup) : Number(gamesmanshipValue);

      return { name: club.name, lineup, posture: postureSelect.value, gamesmanship };
    }

    // ===================== Aba "Partida" (evento a evento) =================

    const POSITION_LABELS = { GK: 'GOL', CB: 'ZAG', FB: 'LAT', MF: 'MEI', FW: 'ATA' };

    // playerId -> { row, badges } DOM refs, rebuilt every match. Ids are
    // unique across both teams, so one map covers both lineup panels.
    let playerRefs = new Map();

    function renderLineup(container, lineup) {
      container.innerHTML = '';
      for (const player of lineup) {
        const row = document.createElement('div');
        row.className = 'player';

        const pos = document.createElement('span');
        pos.className = 'pos';
        pos.textContent = POSITION_LABELS[player.position] ?? player.position;

        const name = document.createElement('span');
        name.className = 'name';
        name.textContent = player.name;
        name.title = player.era ? `${player.name} (${player.era})` : player.name;

        const badges = document.createElement('span');
        badges.className = 'badges';

        if (player.era) {
          const era = document.createElement('span');
          era.className = 'era';
          era.textContent = `'${String(player.era).slice(-2)}`;
          row.append(pos, name, era, badges);
        } else {
          row.append(pos, name, badges);
        }
        container.appendChild(row);
        playerRefs.set(player.id, { row, badges });
      }
    }

    function addBadge(playerId, className, text) {
      const ref = playerRefs.get(playerId);
      if (!ref) return;
      const badge = document.createElement('span');
      badge.className = `badge ${className}`;
      if (text) badge.textContent = text;
      ref.badges.appendChild(badge);
    }

    function applyPlayerEffects(event) {
      if (event.victimId) {
        addBadge(event.victimId, 'badge-injury', '+');
      }
      if (event.cardType && event.playerId) {
        addBadge(event.playerId, event.cardType === 'red' ? 'badge-red' : 'badge-yellow');
        if (event.cardType === 'red') {
          const ref = playerRefs.get(event.playerId);
          if (ref) ref.row.classList.add('sent-off');
        }
      }
      if (event.playerId && GOAL_EVENT_TYPES.has(event.type)) {
        addBadge(event.playerId, 'badge-goal', '⚽');
      }
    }

    const EVENT_CLASS = {
      [EVENT_TYPES.GOAL]: 'ev-goal',
      [EVENT_TYPES.GOAL_ANOTHER]: 'ev-goal',
      [EVENT_TYPES.GOAL_INDIVIDUAL]: 'ev-goal',
      [EVENT_TYPES.GOAL_ASSISTED]: 'ev-goal',
      [EVENT_TYPES.GOAL_CORNER]: 'ev-goal',
      [EVENT_TYPES.GOAL_LONG_SHOT]: 'ev-goal',
      [EVENT_TYPES.GOAL_REFEREE_DEFLECTION]: 'ev-goal',
      [EVENT_TYPES.PLAYER_SPECIAL]: 'ev-special',
      [EVENT_TYPES.GOAL_DEFENSIVE_BLUNDER]: 'ev-goal',
      [EVENT_TYPES.GOAL_GOALKEEPER_BLUNDER]: 'ev-goal',
      [EVENT_TYPES.GOAL_PENALTY]: 'ev-goal',
      [EVENT_TYPES.FREE_KICK_GOAL]: 'ev-goal',
      [EVENT_TYPES.YELLOW_CARD]: 'ev-yellow',
      [EVENT_TYPES.SECOND_YELLOW_RED]: 'ev-red',
      [EVENT_TYPES.STRAIGHT_RED]: 'ev-red',
      [EVENT_TYPES.SCANDALOUS_FOUL]: 'ev-scandalous',
      [EVENT_TYPES.DISALLOWED_GOAL]: 'ev-disallowed',
      [EVENT_TYPES.OFFICIAL_ASSAULTED]: 'ev-red',
      [EVENT_TYPES.OUTFIELD_PLAYER_IN_GOAL]: 'ev-scandalous',
      [EVENT_TYPES.MATCH_ABANDONED]: 'ev-red',
      [EVENT_TYPES.PENALTY_NOT_GIVEN]: 'ev-disallowed',
      [EVENT_TYPES.PENALTY_PHANTOM]: 'ev-disallowed',
      [EVENT_TYPES.PENALTY_WRONG_LOCATION]: 'ev-disallowed',
      [EVENT_TYPES.PENALTY_AWARDED]: 'ev-scandalous',
      [EVENT_TYPES.PENALTY_MIND_GAMES]: 'ev-trash-talk',
      [EVENT_TYPES.PENALTY_MISSED]: 'ev-whiff',
      [EVENT_TYPES.GOALKEEPER_FORWARD]: 'ev-scandalous',
      [EVENT_TYPES.CROWD_SILENCED]: 'ev-trash-talk',
      [EVENT_TYPES.SHOWBOATING]: 'ev-comedy',
      [EVENT_TYPES.SEVERE_INJURY]: 'ev-injury',
      [EVENT_TYPES.NO_CARD_DESPITE_INJURY]: 'ev-injustice',
      [EVENT_TYPES.SCANDALOUS_FOUL_IGNORED]: 'ev-injustice',
      [EVENT_TYPES.NUTMEG_TAUNT]: 'ev-comedy',
      [EVENT_TYPES.TRASH_TALK]: 'ev-trash-talk',
      [EVENT_TYPES.FIGHT_CALLOUT]: 'ev-comedy',
      [EVENT_TYPES.BRAWL]: 'ev-comedy',
      [EVENT_TYPES.BRAWL_CARD_FIRST]: 'ev-red',
      [EVENT_TYPES.BRAWL_CARD]: 'ev-red',
      [EVENT_TYPES.KICKOFF]: 'ev-divider',
      [EVENT_TYPES.HALFTIME]: 'ev-divider',
      [EVENT_TYPES.FULLTIME]: 'ev-divider',
      [EVENT_TYPES.STOPPAGE_TIME_ANNOUNCED]: 'ev-divider',
      [EVENT_TYPES.STOPPAGE_TIME_BOOED_SHORT]: 'ev-trash-talk',
      [EVENT_TYPES.STOPPAGE_TIME_BOOED_LONG]: 'ev-trash-talk',
      [EVENT_TYPES.WHIFF]: 'ev-whiff',
      [EVENT_TYPES.WHIFF_HOME_MISS]: 'ev-whiff',
      [EVENT_TYPES.WALL_SAVE]: 'ev-save',
      [EVENT_TYPES.GOAL_LINE_CLEARANCE]: 'ev-save',
      [EVENT_TYPES.HANDBALL_ON_THE_LINE]: 'ev-scandalous',
      [EVENT_TYPES.TIME_WASTING]: 'ev-time-wasting',
      [EVENT_TYPES.THROW_IN_DELAY]: 'ev-time-wasting',
      [EVENT_TYPES.GOAL_KICK_DELAY]: 'ev-time-wasting',
    };

    let timers = [];
    let playToken = 0;

    function clearTimers() {
      timers.forEach(clearTimeout);
      timers = [];
    }

    function appendEvent(event) {
      const row = document.createElement('div');
      row.className = `event ${EVENT_CLASS[event.type] ?? ''}`;
      if (event.side) row.dataset.side = event.side;

      const minute = document.createElement('span');
      minute.className = 'minute';
      minute.textContent = `${event.minute}'`;

      const text = document.createElement('span');
      text.className = 'text';
      text.textContent = event.description;

      row.append(minute, text);
      els.log.appendChild(row);
      els.log.scrollTop = els.log.scrollHeight;
    }

    function updateScore(event, score) {
      // A WO overwrites the live score with the fixed scoreline (see
      // checkMatchAbandoned in match.js) — snap to it instead of trying to
      // keep incrementing from whatever was on the board. event.side here
      // is the offending team, so the winner's score is the other side.
      if (event.type === EVENT_TYPES.MATCH_ABANDONED) {
        score.home = event.homeGoals;
        score.away = event.awayGoals;
        els.homeScore.textContent = score.home;
        els.awayScore.textContent = score.away;
        const winningSide = event.side === 'home' ? 'away' : 'home';
        const scoringEl = winningSide === 'home' ? els.homeScore : els.awayScore;
        scoringEl.classList.remove('pulse');
        void scoringEl.offsetWidth; // restart animation
        scoringEl.classList.add('pulse');
        return;
      }

      // A disallowed goal now fires AFTER the goal it's taking back was
      // already announced and counted (see match.js resolveAttack), so it
      // has to walk the scoreboard back down instead of being just another
      // non-scoring event.
      if (!GOAL_EVENT_TYPES.has(event.type) && event.type !== EVENT_TYPES.DISALLOWED_GOAL) return;
      score[event.side] += event.type === EVENT_TYPES.DISALLOWED_GOAL ? -1 : 1;
      els.homeScore.textContent = score.home;
      els.awayScore.textContent = score.away;
      const scoringEl = event.side === 'home' ? els.homeScore : els.awayScore;
      scoringEl.classList.remove('pulse');
      void scoringEl.offsetWidth; // restart animation
      scoringEl.classList.add('pulse');
    }

    function playMatch() {
      const token = ++playToken;
      clearTimers();
      els.log.innerHTML = '';
      els.homeScore.textContent = '0';
      els.awayScore.textContent = '0';
      els.clock.textContent = "0'";
      els.playBtn.disabled = true;
      els.status.textContent = 'sorteando os times...';

      const seed = els.seedInput.value ? Number(els.seedInput.value) : Math.floor(Math.random() * 1e9);
      els.seedInput.value = seed;

      const rng = createRng(seed);
      const home = buildTeam('home', rng);
      const away = buildTeam('away', rng);
      els.homeName.textContent = home.name;
      els.awayName.textContent = away.name;

      playerRefs = new Map();
      renderLineup(els.homeLineup, home.lineup);
      renderLineup(els.awayLineup, away.lineup);

      const result = simulateMatch({ home, away, rng });
      const msPerMinute = Number(els.speedSelect.value);
      // However far apart two events are on the match clock, never show them
      // less than this many ms apart in real time — otherwise events that
      // land in the same minute (a foul immediately followed by a card, say)
      // fly by too fast to read, regardless of the speed setting.
      const minEventGap = Math.max(500, msPerMinute * 2.2);
      const score = { home: 0, away: 0 };

      let delay = 300;
      let lastMinute = 0;

      for (const event of result.events) {
        const minuteBasedDelay = delay + (event.minute - lastMinute) * msPerMinute;
        delay = Math.max(minuteBasedDelay, delay + minEventGap);
        lastMinute = event.minute;

        timers.push(
          setTimeout(() => {
            if (token !== playToken) return;
            els.clock.textContent = `${event.minute}'`;
            appendEvent(event);
            updateScore(event, score);
            applyPlayerEffects(event);
            if (event.type === EVENT_TYPES.FULLTIME) {
              els.status.textContent = 'fim de jogo';
              els.playBtn.disabled = false;
            }
          }, delay)
        );
      }

      timers.push(
        setTimeout(() => {
          if (token !== playToken) return;
          els.status.textContent = 'em andamento...';
        }, 300)
      );
    }

    els.playBtn.addEventListener('click', playMatch);

    // ===================== Aba "Calibragem" (várias partidas, agregado) ====
    // Browser port of scripts/calibration.js, but driven by whatever
    // teams/formation/postura/catimba are picked in #teamControls instead of
    // a fixed pair of clubs — so balance can be probed interactively instead
    // of editing the script and re-running it in a terminal.

    // Same approximation used by ResultScreen.jsx and scripts/calibration.js:
    // the engine has no continuous possession state, only independent
    // per-minute attack rolls per side, so "possession" is estimated as each
    // side's share of attacking sequences (every SHOT_EVENT_TYPES event is
    // the resolution of exactly one such sequence).
    const SHOT_EVENT_TYPES = new Set([
      ...GOAL_EVENT_TYPES,
      EVENT_TYPES.WHIFF,
      EVENT_TYPES.WHIFF_HOME_MISS,
      EVENT_TYPES.CHANCE_MISSED,
      EVENT_TYPES.WALL_SAVE,
      EVENT_TYPES.GOAL_LINE_CLEARANCE,
      EVENT_TYPES.HANDBALL_ON_THE_LINE,
      EVENT_TYPES.PENALTY_MISSED,
    ]);

    function countShotsBySide(events) {
      const counts = { home: 0, away: 0 };
      for (const event of events) {
        if (event.side && SHOT_EVENT_TYPES.has(event.type)) counts[event.side]++;
      }
      return counts;
    }

    // A goal event only carries `playerId`, not position, so cross-reference
    // against that match's drafted goalkeepers to count how often one of
    // them is the one credited with the goal (join-the-attack situations, a
    // free-kick specialist trait on a keeper, etc.).
    function countGoalkeeperGoals(result, goalkeeperIds) {
      return result.events.filter((e) => GOAL_EVENT_TYPES.has(e.type) && goalkeeperIds.has(e.playerId)).length;
    }

    function averageOverall(pool) {
      return (pool.reduce((sum, p) => sum + p.overall, 0) / pool.length).toFixed(1);
    }

    function fmtAvg(total, count) {
      return (total / count).toFixed(2);
    }

    function fmtPct(part, total) {
      return total > 0 ? ((part / total) * 100).toFixed(1) : '0.0';
    }

    const GOAL_STYLE_LABELS = {
      plain: 'sem detalhe',
      individual: 'jogada individual',
      assisted: 'assistência',
      corner: 'escanteio',
      longShot: 'chute de longe',
      defensiveBlunder: 'lambança da defesa',
      goalkeeperBlunder: 'frango do goleiro',
      penalty: 'pênalti',
    };

    function emptyTotals() {
      return {
        goals: 0,
        homeGoals: 0,
        awayGoals: 0,
        fouls: 0,
        yellowCards: 0,
        redCards: 0,
        nutmegTaunts: 0,
        brawls: 0,
        scandalousFouls: 0,
        disallowedGoals: 0,
        severeInjuries: 0,
        noCardDespiteInjury: 0,
        trashTalks: 0,
        fightCallouts: 0,
        whiffs: 0,
        goalStyles: {
          plain: 0,
          individual: 0,
          assisted: 0,
          corner: 0,
          longShot: 0,
          defensiveBlunder: 0,
          goalkeeperBlunder: 0,
          penalty: 0,
        },
        penaltiesAwarded: 0,
        penaltiesNotGiven: 0,
        penaltiesPhantom: 0,
        penaltiesWrongLocation: 0,
        penaltyMindGames: 0,
        penaltiesMissed: 0,
        goalkeeperForward: 0,
        crowdSilenced: 0,
        showboating: 0,
        refereeDeflectionGoals: 0,
        specialAbilities: 0,
        stoppageTimeBooed: 0,
        throwInDelays: 0,
        goalKickDelays: 0,
        goalkeeperGoals: 0,
        officialsAssaulted: 0,
        handballsOnTheLine: 0,
        matchAbandoned: 0,
        standInGoalkeepers: 0,
        shots: { home: 0, away: 0 },
      };
    }

    function accumulate(totals, result, goalkeeperIds) {
      totals.goalkeeperGoals += countGoalkeeperGoals(result, goalkeeperIds);
      const shots = countShotsBySide(result.events);
      totals.shots.home += shots.home;
      totals.shots.away += shots.away;
      totals.goals += result.homeGoals + result.awayGoals;
      totals.homeGoals += result.homeGoals;
      totals.awayGoals += result.awayGoals;
      totals.fouls += result.stats.fouls;
      totals.yellowCards += result.stats.yellowCards;
      totals.redCards += result.stats.redCards;
      totals.nutmegTaunts += result.stats.nutmegTaunts;
      totals.brawls += result.stats.brawls;
      totals.scandalousFouls += result.stats.scandalousFouls;
      totals.disallowedGoals += result.stats.disallowedGoals;
      totals.officialsAssaulted += result.stats.officialsAssaulted;
      totals.handballsOnTheLine += result.stats.handballsOnTheLine;
      totals.severeInjuries += result.stats.severeInjuries;
      totals.noCardDespiteInjury += result.stats.noCardDespiteInjury;
      totals.trashTalks += result.stats.trashTalks;
      totals.fightCallouts += result.stats.fightCallouts;
      totals.whiffs += result.stats.whiffs;
      for (const style of Object.keys(totals.goalStyles)) {
        totals.goalStyles[style] += result.stats.goalStyles[style];
      }
      totals.penaltiesAwarded += result.stats.penaltiesAwarded;
      totals.penaltiesNotGiven += result.stats.penaltiesNotGiven;
      totals.penaltiesPhantom += result.stats.penaltiesPhantom;
      totals.penaltiesWrongLocation += result.stats.penaltiesWrongLocation;
      totals.penaltyMindGames += result.stats.penaltyMindGames;
      totals.penaltiesMissed += result.stats.penaltiesMissed;
      totals.goalkeeperForward += result.stats.goalkeeperForward;
      totals.crowdSilenced += result.stats.crowdSilenced;
      totals.showboating += result.stats.showboating;
      totals.refereeDeflectionGoals += result.stats.refereeDeflectionGoals;
      totals.specialAbilities += result.stats.specialAbilities;
      totals.stoppageTimeBooed += result.stats.stoppageTimeBooed;
      totals.throwInDelays += result.stats.throwInDelays;
      totals.goalKickDelays += result.stats.goalKickDelays;
      totals.matchAbandoned += result.stats.matchAbandoned ? 1 : 0;
      totals.standInGoalkeepers += result.stats.standInGoalkeepers;
    }

    function statRow(label, value) {
      return `<div class="cal-stat"><span class="label">${label}</span><span class="value">${value}</span></div>`;
    }

    function renderCalibrationReport(ctx) {
      const {
        totals,
        matchCount,
        homeName,
        awayName,
        homePoolAvg,
        awayPoolAvg,
        homeWins,
        awayWins,
        draws,
        matchesWithRedCard,
        oneSidedRedCardMatches,
        marginForSentOffSide,
        matchesWithComedy,
        formationName,
      } = ctx;

      const totalShots = totals.shots.home + totals.shots.away;
      const homePossessionPct = totalShots > 0 ? fmtPct(totals.shots.home, totalShots) : '50.0';
      const awayPossessionPct = totalShots > 0 ? fmtPct(totals.shots.away, totalShots) : '50.0';
      const avgMarginSentOff =
        oneSidedRedCardMatches > 0 ? (marginForSentOffSide / oneSidedRedCardMatches).toFixed(2) : 'n/a';
      const totalOpenPlayGoals = Object.values(totals.goalStyles).reduce((sum, count) => sum + count, 0);
      const totalPenaltiesTaken = totals.penaltiesMissed + totals.goalStyles.penalty;
      const penaltyConversionPct =
        totalPenaltiesTaken > 0 ? fmtPct(totals.goalStyles.penalty, totalPenaltiesTaken) : '0.0';

      const goalStyleRows = Object.entries(GOAL_STYLE_LABELS)
        .map(([style, label]) => {
          const count = totals.goalStyles[style];
          return `<tr><td>${label}</td><td class="num">${count}</td><td class="num">${fmtPct(count, totalOpenPlayGoals)}%</td></tr>`;
        })
        .join('');

      els.calReport.innerHTML = `
        <div class="cal-section">
          <h2>Resumo — ${matchCount} partidas</h2>
          <p class="cal-stat"><span class="label">${homeName} (casa, overall médio do elenco ${homePoolAvg}) × ${awayName} (fora, overall médio do elenco ${awayPoolAvg}), formação ${formationName}</span></p>
          <div class="cal-grid">
            ${statRow('Vitórias casa', `${homeWins} (${fmtPct(homeWins, matchCount)}%)`)}
            ${statRow('Vitórias fora', `${awayWins} (${fmtPct(awayWins, matchCount)}%)`)}
            ${statRow('Empates', `${draws} (${fmtPct(draws, matchCount)}%)`)}
          </div>
        </div>

        <div class="cal-section">
          <h2>Gols, finalizações e posse</h2>
          <div class="cal-grid">
            ${statRow('Gols por partida', fmtAvg(totals.goals, matchCount))}
            ${statRow('— time da casa', fmtAvg(totals.homeGoals, matchCount))}
            ${statRow('— time visitante', fmtAvg(totals.awayGoals, matchCount))}
            ${statRow('Finalizações por partida', `${fmtAvg(totalShots, matchCount)} (casa ${fmtAvg(totals.shots.home, matchCount)} / fora ${fmtAvg(totals.shots.away, matchCount)})`)}
            ${statRow('Posse de bola (aprox.)', `casa ${homePossessionPct}% / fora ${awayPossessionPct}%`)}
            ${statRow('Gols marcados por goleiro', fmtAvg(totals.goalkeeperGoals, matchCount))}
          </div>
        </div>

        <div class="cal-section">
          <h2>Faltas e cartões</h2>
          <div class="cal-grid">
            ${statRow('Faltas por partida', fmtAvg(totals.fouls, matchCount))}
            ${statRow('Cartões amarelos por partida', fmtAvg(totals.yellowCards, matchCount))}
            ${statRow('Cartões vermelhos por partida', fmtAvg(totals.redCards, matchCount))}
            ${statRow('Partidas com expulsão', `${matchesWithRedCard} (${fmtPct(matchesWithRedCard, matchCount)}%)`)}
            ${statRow('Saldo médio de quem fica com 10', `${avgMarginSentOff} (${oneSidedRedCardMatches} partidas de 1 lado só)`)}
            ${statRow('Partidas com WO (menos de 7 jogadores)', `${totals.matchAbandoned} (${fmtPct(totals.matchAbandoned, matchCount)}%)`)}
            ${statRow('Goleiros de linha (titular expulso)', `${totals.standInGoalkeepers} (${fmtAvg(totals.standInGoalkeepers, matchCount)} por partida)`)}
          </div>
        </div>

        <div class="cal-section">
          <h2>Eventos cômicos (ver CLAUDE.md "Tom dos eventos")</h2>
          <div class="cal-grid">
            ${statRow('Chapéus com provocação', fmtAvg(totals.nutmegTaunts, matchCount))}
            ${statRow('Confusões generalizadas', fmtAvg(totals.brawls, matchCount))}
            ${statRow('Faltas escandalosas', fmtAvg(totals.scandalousFouls, matchCount))}
            ${statRow('Gols anulados por erro', fmtAvg(totals.disallowedGoals, matchCount))}
            ${statRow('Agressão a árbitro/bandeirinha', fmtAvg(totals.officialsAssaulted, matchCount))}
            ${statRow('Mão na bola em cima da linha', fmtAvg(totals.handballsOnTheLine, matchCount))}
            ${statRow('Lesões graves', fmtAvg(totals.severeInjuries, matchCount))}
            ${statRow('Sem cartão apesar da lesão', fmtAvg(totals.noCardDespiteInjury, matchCount))}
            ${statRow('Provocações (fala/gesto)', fmtAvg(totals.trashTalks, matchCount))}
            ${statRow('Chamadas pra briga', fmtAvg(totals.fightCallouts, matchCount))}
            ${statRow('Furadas com vaia', fmtAvg(totals.whiffs, matchCount))}
            ${statRow('Partidas com algum cômico', `${matchesWithComedy} (${fmtPct(matchesWithComedy, matchCount)}%)`)}
          </div>
        </div>

        <div class="cal-section">
          <h2>Como os gols de bola rolando aconteceram</h2>
          <table class="cal-table">
            <thead><tr><th>Estilo</th><th class="num">Total</th><th class="num">%</th></tr></thead>
            <tbody>${goalStyleRows}</tbody>
          </table>
        </div>

        <div class="cal-section">
          <h2>Pênaltis (situação, não só o gol)</h2>
          <div class="cal-grid">
            ${statRow('Dados de verdade', fmtAvg(totals.penaltiesAwarded, matchCount))}
            ${statRow('Claros e não marcados', fmtAvg(totals.penaltiesNotGiven, matchCount))}
            ${statRow('Fantasmas (não existiram)', fmtAvg(totals.penaltiesPhantom, matchCount))}
            ${statRow('Falta fora da área, erro do juiz', fmtAvg(totals.penaltiesWrongLocation, matchCount))}
            ${statRow('Com pressão do goleiro', fmtAvg(totals.penaltyMindGames, matchCount))}
            ${statRow('Perdidos na cobrança', fmtAvg(totals.penaltiesMissed, matchCount))}
            ${statRow('Conversão na cobrança', `${penaltyConversionPct}% (referência real: ~75-80%)`)}
          </div>
        </div>

        <div class="cal-section">
          <h2>Outros eventos</h2>
          <div class="cal-grid">
            ${statRow('Goleiro-linha (bola parada, desespero)', fmtAvg(totals.goalkeeperForward, matchCount))}
            ${statRow('Torcida calada (visitante vira o jogo)', fmtAvg(totals.crowdSilenced, matchCount))}
            ${statRow('Embaixadinhas (provocação)', fmtAvg(totals.showboating, matchCount))}
            ${statRow('Gol com desvio no juiz', fmtAvg(totals.refereeDeflectionGoals, matchCount))}
            ${statRow('Eventos especiais de jogador', fmtAvg(totals.specialAbilities, matchCount))}
            ${statRow('Torcida vaia o acréscimo', fmtAvg(totals.stoppageTimeBooed, matchCount))}
            ${statRow('Demora no lateral', fmtAvg(totals.throwInDelays, matchCount))}
            ${statRow('Demora no tiro de meta', fmtAvg(totals.goalKickDelays, matchCount))}
          </div>
        </div>
      `;
    }

    function runCalibration() {
      const baseSeed = els.calSeedInput.value ? Number(els.calSeedInput.value) : Math.floor(Math.random() * 1e9);
      els.calSeedInput.value = baseSeed;
      const matchCount = Math.max(1, Math.min(5000, Math.round(Number(els.calCountInput.value) || 500)));
      els.calCountInput.value = matchCount;

      els.calRunBtn.disabled = true;
      els.calStatus.textContent = `rodando ${matchCount} partidas...`;

      // Deferred so the "rodando..." status actually paints before the
      // (synchronous, potentially CPU-heavy for large match counts) loop
      // below blocks the main thread.
      setTimeout(() => {
        const totals = emptyTotals();
        let homeWins = 0;
        let awayWins = 0;
        let draws = 0;
        let matchesWithRedCard = 0;
        let matchesWithComedy = 0;
        // Checks whether being down a player actually hurts more (see the
        // SHORT_HANDED_DEFENSE_PENALTY asymmetry in teamPower/match.js) —
        // only counts matches where exactly one side had a red card, since a
        // match with cards on both sides doesn't isolate "who was down".
        let oneSidedRedCardMatches = 0;
        let marginForSentOffSide = 0;

        let homeName = '';
        let awayName = '';

        for (let i = 0; i < matchCount; i++) {
          const rng = createRng(baseSeed + i);
          const home = buildTeam('home', rng);
          const away = buildTeam('away', rng);
          homeName = home.name;
          awayName = away.name;

          const goalkeeperIds = new Set(
            [...home.lineup, ...away.lineup].filter((p) => p.position === 'GK').map((p) => p.id)
          );
          const result = simulateMatch({ home, away, rng });
          accumulate(totals, result, goalkeeperIds);

          if (result.homeGoals > result.awayGoals) homeWins++;
          else if (result.awayGoals > result.homeGoals) awayWins++;
          else draws++;

          if (result.stats.redCards > 0) matchesWithRedCard++;
          const redHome = result.stats.redCardsBySide.home > 0;
          const redAway = result.stats.redCardsBySide.away > 0;
          if (redHome !== redAway) {
            oneSidedRedCardMatches++;
            marginForSentOffSide += redHome ? result.homeGoals - result.awayGoals : result.awayGoals - result.homeGoals;
          }
          if (
            result.stats.officialsAssaulted > 0 ||
            result.stats.brawls > 0 ||
            result.stats.scandalousFouls > 0 ||
            result.stats.fightCallouts > 0
          ) {
            matchesWithComedy++;
          }
        }

        const homeClub = SAMPLE_CLUBS[Number(els.homeClubSelect.value)];
        const awayClub = SAMPLE_CLUBS[Number(els.awayClubSelect.value)];

        renderCalibrationReport({
          totals,
          matchCount,
          homeName,
          awayName,
          homePoolAvg: averageOverall(homeClub.pool),
          awayPoolAvg: averageOverall(awayClub.pool),
          homeWins,
          awayWins,
          draws,
          matchesWithRedCard,
          oneSidedRedCardMatches,
          marginForSentOffSide,
          matchesWithComedy,
          formationName: els.formationSelect.value,
        });

        els.calRunBtn.disabled = false;
        els.calStatus.textContent = 'concluído';
      }, 20);
    }

    els.calRunBtn.addEventListener('click', runCalibration);
  </script>
</body>
</html>
